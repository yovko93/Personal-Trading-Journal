name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PersonalTradingJournal.sln

      - name: Build
        run: dotnet build PersonalTradingJournal.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PersonalTradingJournal.sln --configuration Release --no-build
