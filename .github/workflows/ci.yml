name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    env:
      PTJ_TEST_RESULTS_DIRECTORY: ${{ github.workspace }}/TestResults

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PersonalTradingJournal.sln

      - name: Build
        run: dotnet build PersonalTradingJournal.sln --configuration Release --no-restore

      - name: Test
        timeout-minutes: 10
        run: dotnet test PersonalTradingJournal.sln --configuration Release --no-build --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type mini --diag TestResults/vstest.log

      - name: Upload test results and native WPF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: TestResults/
          if-no-files-found: warn
